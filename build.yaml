# Wolfie Split Trackball — individual diagnostic and working builds.
# Keep this file at the repository root. Use exactly two spaces before each '- board'.
include:
  # Original keyboard + PMW3610 fallback (no display).
  - board: nice_nano/nrf52840/zmk
    shield: right_half_test
    artifact-name: wolfie_right_keys_trackball

  # Display-only diagnostic.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_display_diag wolfie_display_bus wolfie_niceview
    artifact-name: wolfie_display_only_diagnostic
  # Keyboard + upright eye, safe letter-only keymap.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_keys_eye_test wolfie_display_bus wolfie_niceview
    artifact-name: wolfie_keys_eye_safe_test

  # Keyboard QWERTY + upright eye, no PMW3610.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_keys_eye_qwerty wolfie_display_bus wolfie_niceview
    artifact-name: wolfie_keys_eye_qwerty
  # Keyboard + upright eye + PMW3610, safe letter-only keymap.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_keys_eye_pmw_safe wolfie_display_bus wolfie_niceview
    artifact-name: wolfie_keys_eye_pmw_safe

  # Full working right half — QWERTY/AltGr + eye + PMW3610.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_keys_eye_pmw_qwerty wolfie_display_bus wolfie_niceview
    artifact-name: wolfie_keys_eye_pmw_qwerty
  # Left-hand matrix diagnostic.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_left_matrix_test
    artifact-name: wolfie_left_matrix_test

  # Left-hand Corne-style default layout with None / Win / None / Space thumbs.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_left_corne
    artifact-name: wolfie_left_corne_no_layer
  # Clears stored ZMK settings, including Bluetooth bonding information.
  - board: nice_nano/nrf52840/zmk
    shield: settings_reset
    artifact-name: wolfie_settings_reset

  # New split integration test — right central keeps PMW3610 + custom eye.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_split_right wolfie_display_bus wolfie_niceview
    # Keep the previously tested display thread priority on the normal build.
    cmake-args: -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10 -DCONFIG_ZMK_IDLE_TIMEOUT=60000 -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000
    artifact-name: wolfie_split_right_central

  # Bluetooth lag diagnostic — same split right central + PMW3610, NO display.
  # Do not flash this permanently: it is only for testing input latency over BLE.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_split_right
    artifact-name: wolfie_split_right_no_display

  # BLE host connection-interval test: request 7.5 ms; no nice!view rendering.
  # Separate target leaves both the normal and no-display baseline builds intact.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_split_right
    cmake-args: -DCONFIG_BT_PERIPHERAL_PREF_MIN_INT=6 -DCONFIG_BT_PERIPHERAL_PREF_MAX_INT=6 -DCONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
    artifact-name: wolfie_split_right_bt75_no_display

  # Controlled BLE test: request 7.5 ms link + 7 ms PMW3610 report minimum.
  # No display. This is separate from the existing 12 ms BLE diagnostic and normal builds.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_split_right
    cmake-args: -DCONFIG_BT_PERIPHERAL_PREF_MIN_INT=6 -DCONFIG_BT_PERIPHERAL_PREF_MAX_INT=6 -DCONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y -DCONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=7
    artifact-name: wolfie_split_right_bt75_sensor7_no_display

  # Bluetooth HID notification scheduling test: raise BLE notify worker priority
  # from ZMK default 5 to 4. Same proven sensor7+BT7.5 settings; NO display.
  # Keep this separate so the previous sensor7 test stays available.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_split_right
    cmake-args: -DCONFIG_BT_PERIPHERAL_PREF_MIN_INT=6 -DCONFIG_BT_PERIPHERAL_PREF_MAX_INT=6 -DCONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y -DCONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=7 -DCONFIG_ZMK_BLE_THREAD_PRIORITY=4
    artifact-name: wolfie_split_right_bt75_sensor7_bleprio4_no_display

  # RIGHT full-display performance test: proven eye + battery + BT/layer status,
  # combined with the smoothest no-display Bluetooth HID timing experiment.
  # Does NOT change the original wolfie_split_right_central or any other builds.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_split_right wolfie_display_bus wolfie_niceview
    cmake-args: -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10 -DCONFIG_BT_PERIPHERAL_PREF_MIN_INT=6 -DCONFIG_BT_PERIPHERAL_PREF_MAX_INT=6 -DCONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y -DCONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=7 -DCONFIG_ZMK_BLE_THREAD_PRIORITY=4
    artifact-name: wolfie_split_right_bt75_sensor7_bleprio4_display

  # Diagnostic only: faster 4 ms PMW3610 sampling in ACTIVE state, with the
  # proven 7 ms PMW3610 report limit and requested 7.5 ms BLE host interval.
  # No right display; original working and earlier diagnostic builds unchanged.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_split_right wolfie_pmw3610_4ms
    cmake-args: -DCONFIG_BT_PERIPHERAL_PREF_MIN_INT=6 -DCONFIG_BT_PERIPHERAL_PREF_MAX_INT=6 -DCONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y -DCONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=7
    artifact-name: wolfie_split_right_bt75_sensor4_awake_no_display

  # Left peripheral — 22 keys, no display until split connection is tested.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_split_left
    artifact-name: wolfie_split_left_peripheral

  # Stage 1 left nice!view: keeps working 22-key BLE peripheral, adds static WOLFIE L.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_split_left wolfie_display_bus wolfie_leftview
    artifact-name: wolfie_split_left_display_test

  # TEST ONLY: 30 s idle, 60 min deep sleep — optimized RIGHT central + full nice!view.
  # Preserves 7.5 ms BLE request, 7 ms PMW3610 batching, BLE priority 4,
  # existing keymap, eye + battery/BT/layer status, and profile-specific CPI.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_split_right wolfie_display_bus wolfie_niceview
    cmake-args: -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10 -DCONFIG_BT_PERIPHERAL_PREF_MIN_INT=6 -DCONFIG_BT_PERIPHERAL_PREF_MAX_INT=6 -DCONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y -DCONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=7 -DCONFIG_ZMK_BLE_THREAD_PRIORITY=4 -DCONFIG_ZMK_IDLE_TIMEOUT=30000 -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
    artifact-name: wolfie_split_right_sleep_60m

  # TEST ONLY: 30 s idle, 60 min deep sleep — LEFT peripheral + full nice!view.
  # Retains space artwork, battery and LINK indicator.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_split_left wolfie_display_bus wolfie_leftview
    cmake-args: -DCONFIG_ZMK_IDLE_TIMEOUT=30000 -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
    artifact-name: wolfie_split_left_sleep_60m

  # TEST ONLY: 60 s idle, 20 min deep sleep — optimized RIGHT central + full nice!view.
  # Preserves successful 7.5 ms BLE request, PMW3610 7 ms report minimum,
  # Bluetooth worker priority 4, eye/status display and BT1 profile-dependent CPI.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_split_right wolfie_display_bus wolfie_niceview
    cmake-args: -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10 -DCONFIG_BT_PERIPHERAL_PREF_MIN_INT=6 -DCONFIG_BT_PERIPHERAL_PREF_MAX_INT=6 -DCONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y -DCONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=7 -DCONFIG_ZMK_BLE_THREAD_PRIORITY=4 -DCONFIG_ZMK_IDLE_TIMEOUT=60000 -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000
    artifact-name: wolfie_split_right_sleep_20m

  # TEST ONLY: 60 s idle, 20 min deep sleep — LEFT peripheral + nice!view.
  # Keeps left space scene, percentage and LINK indicator unmodified.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_split_left wolfie_display_bus wolfie_leftview
    cmake-args: -DCONFIG_ZMK_IDLE_TIMEOUT=60000 -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000
    artifact-name: wolfie_split_left_sleep_20m

    
  # TEST ONLY: PMW3610 12ms report interval.
  # Same Bluetooth, display and sleep settings as the working 20m build.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_split_right wolfie_display_bus wolfie_niceview
    cmake-args: -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10 -DCONFIG_BT_PERIPHERAL_PREF_MIN_INT=6 -DCONFIG_BT_PERIPHERAL_PREF_MAX_INT=6 -DCONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y -DCONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12 -DCONFIG_ZMK_BLE_THREAD_PRIORITY=4 -DCONFIG_ZMK_IDLE_TIMEOUT=60000 -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000
    artifact-name: wolfie_split_right_sensor12_sleep_20m


  # Diagnostic: 15ms BLE connection between keyboard halves.
  # Keep the host BLE interval, sensor, CPI, display and sleep unchanged.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_split_right wolfie_display_bus wolfie_niceview
    cmake-args: -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10 -DCONFIG_BT_PERIPHERAL_PREF_MIN_INT=6 -DCONFIG_BT_PERIPHERAL_PREF_MAX_INT=6 -DCONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y -DCONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=7 -DCONFIG_ZMK_BLE_THREAD_PRIORITY=4 -DCONFIG_ZMK_IDLE_TIMEOUT=60000 -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000 -DCONFIG_ZMK_SPLIT_BLE_PREF_INT=12
    artifact-name: wolfie_split_right_split15_sleep_20m

