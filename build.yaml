include:
  # Known-working keyboard+trackball fallback, unchanged.
  - board: nice_nano/nrf52840/zmk
    shield: right_half_test
    artifact-name: wolfie_right_keys_trackball

  # NO real key scanner, NO trackball listener. Static custom eye only.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_display_diag wolfie_display_bus wolfie_niceview
    artifact-name: wolfie_display_only_diagnostic

  # Stage 2: real 4x6 matrix and upright static eye; NO PMW3610.
  # Letter-only keymap prevents Alt/Ctrl/Win shortcuts during fault-finding.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_keys_eye_test wolfie_display_bus wolfie_niceview
    artifact-name: wolfie_keys_eye_safe_test

  # Stage 3: QWERTY/AltGr + the proven upright static eye; PMW3610 disabled.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_keys_eye_qwerty wolfie_display_bus wolfie_niceview
    artifact-name: wolfie_keys_eye_qwerty

  # Stage 4: letter-only matrix + upright static eye + PMW3610.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_keys_eye_pmw_safe wolfie_display_bus wolfie_niceview
    artifact-name: wolfie_keys_eye_pmw_safe

  # Stage 5: proven QWERTY/AltGr + upright static eye + PMW3610.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_keys_eye_pmw_qwerty wolfie_display_bus wolfie_niceview
    artifact-name: wolfie_keys_eye_pmw_qwerty

  # LEFT ONLY: USB matrix test, no nice!view, no trackball.
  - board: nice_nano/nrf52840/zmk
    shield: wolfie_left_matrix_test
    artifact-name: wolfie_left_matrix_test
