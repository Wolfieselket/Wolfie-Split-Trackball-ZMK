# Stage 4: existing keyboard matrix and static eye, PMW3610 restored.
# The alphabet-only keymap makes accidental matrix input less hazardous.
CONFIG_ZMK_USB=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=y

# Keep sensor startup behaviour consistent with proven test.
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000
