# Split central: existing keyboard matrix, animated eye, PMW3610
# Proven PMW3610 configuration, central owns combined 44-key keymap.
CONFIG_ZMK_USB=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=y

# Keep sensor startup behaviour consistent with proven test.
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12
# The display thread priority is applied only to the display-enabled right build
# in build.yaml; keeping it out of this shared .conf allows the no-display
# diagnostic to compile without an inactive Kconfig symbol warning.

# Bluetooth 1M PHY compatibility test
CONFIG_BT_CTLR_PHY_2M=n
